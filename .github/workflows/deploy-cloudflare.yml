name: Deploy BioCore to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: biocore-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the approved revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check and build the website
        run: npm run check && npm run build

      - name: Deploy to the BioCore Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: '811e5d391528ff82832edd2162e791ae'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the BioCore deployment token as the CLOUDFLARE_API_TOKEN repository secret."
            exit 1
          fi
          npx wrangler deploy --keep-vars --tag "$GITHUB_SHA" --message "GitHub Actions commit $GITHUB_SHA"

      - name: Verify the live website
        run: node scripts/verify-deployment.mjs
